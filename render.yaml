services:
  - type: web
    name: lrc-journee-recruitment
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/jpch07/lrc-journee-recruitment
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LRC_DATABASE_URL
        sync: false
      - key: LRC_JOURNEE_ADMIN_PASSWORD_HASH
        sync: false
      - key: LRC_JOURNEE_SESSION_SECRET
        generateValue: true
      - key: LRC_JOURNEE_ENV
        value: production
      - key: LRC_JOURNEE_COOKIE_SECURE
        value: "true"
      - key: LRC_JOURNEE_TEST_TOOLS
        value: "false"
      - key: LRC_JOURNEE_SESSION_HOURS
        value: "12"
      - key: LRC_GITHUB_ACTIONS_TOKEN
        sync: false
      - key: LRC_GITHUB_REPOSITORY
        value: jpch07/lrc-journee-recruitment
      - key: LRC_GITHUB_WORKFLOW
        value: event-day-watchdog.yml
      - key: LRC_RECRUIT_SHEET_ID
        value: 1jlVdC5Hwqy78ivZ2JhxEBcJv3SUWsJ6F
      - key: LRC_RECRUIT_SHEET_NAME
        value: List of Recruits
      - key: LRC_RECRUIT_SHEET_SYNC_SECONDS
        value: "300"
