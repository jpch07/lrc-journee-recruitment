name: Test and build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not browser" -q
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m browser -q
        env:
          RUN_PLAYWRIGHT: "1"
      - run: docker build -t lrc-journee-recruitment .
