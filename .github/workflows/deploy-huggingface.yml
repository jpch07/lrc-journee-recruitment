name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: lrc-journee-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not browser" -q
      - run: python scripts/deploy_huggingface_space.py --repo-id lrc203/journee-recruitment
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
