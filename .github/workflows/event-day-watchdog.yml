name: Event-day health monitor

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: Keep the application warm for this many hours
        required: true
        default: "4"
        type: choice
        options: ["2", "4", "6"]

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check health every five minutes
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
          DURATION_HOURS: ${{ inputs.duration_hours }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "Set the RENDER_APP_URL repository variable first."
            exit 1
          fi
          attempts=$((DURATION_HOURS * 12))
          for ((i=1; i<=attempts; i++)); do
            echo "Health check $i/$attempts"
            curl --fail --show-error --silent --max-time 90 \
              --retry 3 --retry-delay 10 --retry-all-errors \
              "${APP_URL%/}/health/live"
            curl --fail --show-error --silent --max-time 90 \
              --retry 3 --retry-delay 10 --retry-all-errors \
              "${APP_URL%/}/health/ready"
            if [ "$i" -lt "$attempts" ]; then sleep 300; fi
          done
