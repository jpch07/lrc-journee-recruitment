name: Event-day protection

on:
  schedule:
    # Offset from the top of the hour because scheduled Actions are most likely
    # to be delayed when many repositories start work at minute zero.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      duration_hours:
        description: Run two redundant one-minute monitors for this many hours
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions:
  contents: read

jobs:
  scheduled-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep the application warm
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: >-
          python scripts/event_day_guard.py
          "${APP_URL}"
          --cycles 1
          --retry-count 5
          --retry-delay-seconds 10

  primary-monitor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
      - name: Run primary event-day monitor
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
          DURATION_HOURS: ${{ inputs.duration_hours }}
        run: >-
          python scripts/event_day_guard.py
          "${APP_URL}"
          --duration-minutes "$((DURATION_HOURS * 60))"
          --interval-seconds 60
          --retry-count 6
          --retry-delay-seconds 10

  secondary-monitor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
      - name: Run offset backup event-day monitor
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
          DURATION_HOURS: ${{ inputs.duration_hours }}
        run: >-
          python scripts/event_day_guard.py
          "${APP_URL}"
          --duration-minutes "$((DURATION_HOURS * 60))"
          --interval-seconds 60
          --initial-delay-seconds 30
          --retry-count 6
          --retry-delay-seconds 10
