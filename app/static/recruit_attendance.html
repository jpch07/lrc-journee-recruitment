<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b20d2d">
  <title>LRC Recruit Attendance</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260807.5">
</head>
<body class="attendance-body">
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <header class="attendance-header">
    <span class="brand-mark small">LRC</span>
    <div><strong>Recruit attendance</strong><small id="attendanceJourneyName">Journee Recruitment</small></div>
    <button id="attendanceLogout" class="button ghost small hidden">Log out</button>
  </header>
  <main id="recruitAttendanceHost" class="attendance-shell"><div class="loading-card">Loading attendance…</div></main>
  <dialog id="attendanceModal" class="modal"><div id="attendanceModalBody"></div></dialog>
  <dialog id="photoViewer" class="photo-viewer"><button type="button" class="photo-viewer-close" aria-label="Close photo">×</button><img id="photoViewerImage" alt=""><p id="photoViewerCaption"></p></dialog>
  <script type="module" src="/static/recruit_attendance.js?v=20260807.5"></script>
